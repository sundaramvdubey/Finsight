name: Validate Finsight data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install --upgrade pip pandas
      - name: Validate processed dataset and official pulse
        run: python scripts/validate_data.py
      - name: Run model benchmark
        run: python scripts/model_benchmark.py
      - name: Check generated benchmark artifact
        run: test -s data/processed/model_benchmark.json
