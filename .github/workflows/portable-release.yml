name: Build portable Finsight app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to receive the portable bundle"
        required: true
        type: string

permissions:
  contents: write

jobs:
  portable:
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/package_portable.sh
      - name: Attach portable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" portable/finsight-v1-static.zip --clobber
